<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAK English Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --paper:#F3F6F8; --surface:#FFFFFF; --surface-alt:#E9EEF2; --line:#D3DCE3;
    --ink:#14273B; --ink-soft:#4C6072; --ink-faint:#7C8DA0;
    --blue:#1F5C8B; --blue-deep:#123A57; --blue-tint:#E4EEF5;
    --orange:#D9782D; --orange-tint:#FBEADA;
    --success:#2E8B57; --success-tint:#E4F3EA;
    --danger:#C1443A; --danger-tint:#FBE7E4;
    --warning:#B8801E; --warning-tint:#FBEFDA;
    --tab-1:#1F5C8B; --tab-2:#D9782D; --tab-3:#3E8E7E; --tab-4:#7A5FA0;
    --chrome:#123A57; --chrome-ink:#DCEAF2;
    --shadow:0 1px 2px rgba(20,39,59,.06), 0 6px 20px -8px rgba(20,39,59,.18);
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0E1B26; --surface:#152531; --surface-alt:#1B2E3E; --line:#2B3F51;
      --ink:#E7EEF3; --ink-soft:#AFC0CD; --ink-faint:#7C93A3;
      --blue:#5CA4D6; --blue-deep:#8FC3E8; --blue-tint:#1B3A4C;
      --orange:#E8934E; --orange-tint:#3A2B1B;
      --success:#57B98A; --success-tint:#173226;
      --danger:#E2776B; --danger-tint:#3A1E1C;
      --warning:#E0B15C; --warning-tint:#3A2E15;
      --tab-1:#5CA4D6; --tab-2:#E8934E; --tab-3:#5FB39F; --tab-4:#A18BD1;
      --chrome:#0B1826; --chrome-ink:#CFE0EC;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -10px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0E1B26; --surface:#152531; --surface-alt:#1B2E3E; --line:#2B3F51;
    --ink:#E7EEF3; --ink-soft:#AFC0CD; --ink-faint:#7C93A3;
    --blue:#5CA4D6; --blue-deep:#8FC3E8; --blue-tint:#1B3A4C;
    --orange:#E8934E; --orange-tint:#3A2B1B;
    --success:#57B98A; --success-tint:#173226;
    --danger:#E2776B; --danger-tint:#3A1E1C;
    --warning:#E0B15C; --warning-tint:#3A2E15;
    --tab-1:#5CA4D6; --tab-2:#E8934E; --tab-3:#5FB39F; --tab-4:#A18BD1;
    --chrome:#0B1826; --chrome-ink:#CFE0EC;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -10px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Source Sans 3", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.disp{font-family:"Archivo", ui-sans-serif, sans-serif; text-wrap:balance;}
  .mono{font-family:"IBM Plex Mono", ui-monospace, monospace;}
  a{color:var(--blue);}
  button{font-family:inherit;}
  ::selection{background:var(--orange-tint);}

  #app{min-height:100vh; display:flex; flex-direction:column;}

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex; align-items:center; gap:14px;
    padding:12px clamp(16px,3vw,28px);
    background:var(--chrome); color:#fff;
    position:sticky; top:0; z-index:40;
    box-shadow:var(--shadow);
  }
  .brandmark{
    width:38px; height:38px; border-radius:9px; background:var(--orange);
    display:flex; align-items:center; justify-content:center; flex:none;
    font-family:"IBM Plex Mono"; font-weight:600; font-size:13px; color:#241305;
  }
  .brandtext{display:flex; flex-direction:column; line-height:1.15;}
  .brandtext b{font-family:"Archivo"; font-size:16px; font-weight:800; letter-spacing:.2px;}
  .brandtext span{font-size:11.5px; color:var(--chrome-ink); letter-spacing:.4px; text-transform:uppercase;}
  .topbar-spacer{flex:1;}
  .topbar .who{
    display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--chrome-ink);
    background:rgba(255,255,255,.08); padding:6px 12px; border-radius:999px;
  }
  .iconbtn{
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.18); color:#fff;
    width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:16px; flex:none;
  }
  .iconbtn:hover{background:rgba(255,255,255,.2);}
  .iconbtn:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{outline:3px solid var(--orange); outline-offset:2px;}

  /* ---------- Shell ---------- */
  .shell{flex:1; display:flex; align-items:flex-start; max-width:1180px; margin:0 auto; width:100%; gap:0;}
  .sidebar{
    width:220px; flex:none; padding:20px 12px 40px; position:sticky; top:66px;
    display:flex; flex-direction:column; gap:6px;
  }
  .sidebar .grouplabel{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); padding:10px 12px 6px;}
  .tab{
    display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:10px;
    cursor:pointer; border:1px solid transparent; background:none; width:100%; text-align:left;
    color:var(--ink-soft); font-size:14.5px; font-weight:600; position:relative;
  }
  .tab .stripe{width:5px; height:22px; border-radius:3px; flex:none; background:var(--accent, var(--blue));}
  .tab small{display:block; font-weight:500; font-size:11.5px; color:var(--ink-faint); margin-top:1px;}
  .tab:hover{background:var(--surface-alt);}
  .tab.active{background:var(--surface); border-color:var(--line); color:var(--ink); box-shadow:var(--shadow);}
  .tab.active .stripe{background:var(--accent, var(--blue));}

  main.content{flex:1; min-width:0; padding:22px clamp(14px,3vw,28px) 60px;}

  /* ---------- Welcome ---------- */
  .welcome-wrap{max-width:640px; margin:6vh auto; padding:0 16px;}
  .welcome-card{
    background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:clamp(24px,5vw,40px);
    box-shadow:var(--shadow);
  }
  .welcome-card h1{font-size:clamp(24px,4vw,32px); margin:2px 0 6px; color:var(--blue-deep);}
  .welcome-card p.lead{color:var(--ink-soft); margin:0 0 22px; font-size:15px; line-height:1.55;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12.5px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); margin-bottom:6px;}
  input[type=text], input[type=password], textarea{
    width:100%; font-size:15px; padding:11px 13px; border-radius:10px; border:1.5px solid var(--line);
    background:var(--paper); color:var(--ink); font-family:inherit;
  }
  textarea{resize:vertical; min-height:110px; line-height:1.5;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:11px 20px; border-radius:10px; border:none; cursor:pointer;
    font-weight:700; font-size:14.5px; font-family:inherit; transition:transform .08s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--orange); color:#2A1608;}
  .btn-primary:hover{background:#c96c22;}
  :root[data-theme="dark"] .btn-primary:hover, @media (prefers-color-scheme:dark){ }
  .btn-blue{background:var(--blue); color:#fff;}
  .btn-blue:hover{background:var(--blue-deep);}
  .btn-ghost{background:var(--surface-alt); color:var(--ink);}
  .btn-ghost:hover{background:var(--line);}
  .btn-sm{padding:7px 13px; font-size:13px;}
  .btn[disabled]{opacity:.5; cursor:not-allowed;}
  .link-btn{background:none; border:none; color:var(--blue); cursor:pointer; font-size:13.5px; font-weight:600; padding:0;}

  /* ---------- Module top / cards ---------- */
  .modheader{display:flex; flex-wrap:wrap; align-items:baseline; gap:10px 16px; margin-bottom:4px;}
  .modheader h2{font-size:clamp(20px,3vw,26px); margin:0; color:var(--blue-deep);}
  .pagebadge{font-family:"IBM Plex Mono"; font-size:12px; font-weight:600; color:var(--blue); background:var(--blue-tint); padding:3px 9px; border-radius:999px;}
  .subline{color:var(--ink-soft); font-size:14px; margin:2px 0 22px;}
  .moduletabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:22px; border-bottom:1px solid var(--line); padding-bottom:0;}
  .mtab{
    background:none; border:none; padding:9px 14px; font-size:13.5px; font-weight:700; color:var(--ink-faint);
    cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-1px; font-family:inherit;
  }
  .mtab.active{color:var(--blue-deep); border-bottom-color:var(--accent, var(--orange));}
  .mtab:hover{color:var(--ink);}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow);}
  .stack{display:flex; flex-direction:column; gap:14px;}
  .grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px;}

  /* Task cards */
  .task{display:flex; gap:14px; align-items:flex-start; padding:14px 16px; border:1px solid var(--line); border-radius:12px; background:var(--surface);}
  .task input[type=checkbox]{width:19px; height:19px; margin-top:3px; accent-color:var(--success); flex:none;}
  .task .taskmeta{font-family:"IBM Plex Mono"; font-size:11.5px; font-weight:600; color:var(--blue); background:var(--blue-tint); padding:2px 8px; border-radius:6px; white-space:nowrap;}
  .task .tasktext{font-size:14.5px; line-height:1.5;}
  .task .taskhint{font-size:13px; color:var(--ink-soft); margin-top:4px; padding-left:2px;}
  .task .taskhint b{color:var(--orange); font-weight:700;}
  .task.done{opacity:.55;}
  .task.done .tasktext{text-decoration:line-through;}

  /* Flashcard */
  .flashwrap{display:flex; flex-direction:column; align-items:center; gap:16px;}
  .flashcard{
    width:min(420px,100%); height:190px; border-radius:16px; cursor:pointer; position:relative;
    background:linear-gradient(160deg,var(--surface),var(--surface-alt)); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; text-align:center; padding:20px;
    box-shadow:var(--shadow); font-size:22px; font-weight:700; color:var(--blue-deep);
  }
  .flashcard .side-label{position:absolute; top:12px; left:16px; font-family:"IBM Plex Mono"; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint);}
  .flashcard.flip{color:var(--orange);}
  .flashnav{display:flex; align-items:center; gap:12px;}
  .flashnav .count{font-family:"IBM Plex Mono"; font-size:13px; color:var(--ink-soft);}

  /* Quiz / grammar items */
  .qitem{border:1px solid var(--line); border-radius:12px; padding:14px 16px; background:var(--surface);}
  .qitem .qtext{font-size:14.5px; margin-bottom:10px; line-height:1.5;}
  .options{display:flex; flex-direction:column; gap:7px;}
  .opt{display:flex; align-items:center; gap:9px; padding:9px 12px; border:1.5px solid var(--line); border-radius:9px; cursor:pointer; font-size:14px;}
  .opt:hover{background:var(--surface-alt);}
  .opt.selected{border-color:var(--blue); background:var(--blue-tint);}
  .opt.correct{border-color:var(--success); background:var(--success-tint);}
  .opt.incorrect{border-color:var(--danger); background:var(--danger-tint);}
  .opt input{accent-color:var(--blue);}
  .qitem.graded-correct{border-left:4px solid var(--success);}
  .qitem.graded-incorrect{border-left:4px solid var(--danger);}
  .qanswerline{font-size:13px; margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); color:var(--ink-soft);}
  .qanswerline b{color:var(--success);}

  .resultbar{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    padding:14px 18px; border-radius:12px; background:var(--blue-tint); border:1px solid var(--line);
  }
  .resultbar .score{font-family:"IBM Plex Mono"; font-size:22px; font-weight:600; color:var(--blue-deep);}
  .badge{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px;}
  .badge-success{background:var(--success-tint); color:var(--success);}
  .badge-warning{background:var(--warning-tint); color:var(--warning);}
  .badge-info{background:var(--blue-tint); color:var(--blue);}

  /* Pronunciation */
  .prow{display:flex; align-items:center; gap:14px; padding:12px 16px; border:1px solid var(--line); border-radius:12px; background:var(--surface); flex-wrap:wrap;}
  .prow .ptarget{flex:1; min-width:160px; font-size:15px; font-weight:600;}
  .mic{
    height:36px; padding:0 14px; border-radius:999px; border:none; background:var(--blue); color:#fff; font-size:13px; font-weight:700;
    cursor:pointer; flex:none; display:flex; align-items:center; justify-content:center; gap:4px; white-space:nowrap;
  }
  .mic:hover{filter:brightness(1.08);}

  /* Writing */
  .wordcount{font-family:"IBM Plex Mono"; font-size:12.5px; color:var(--ink-faint); margin-top:6px;}
  .feedbackbox{
    margin-top:14px; padding:16px 18px; border-radius:12px; background:var(--orange-tint); border:1px solid var(--line);
    font-size:14px; line-height:1.6; white-space:pre-wrap;
  }
  .feedbackbox .ftitle{font-family:"IBM Plex Mono"; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--orange); margin-bottom:8px; display:block; font-weight:600;}

  /* Games */
  .gamecard{border:1px solid var(--line); border-radius:14px; padding:18px; background:var(--surface); display:flex; flex-direction:column; gap:10px;}
  .gamecard h3{margin:0; font-size:16.5px;}
  .gamecard .gdesc{font-size:13.5px; color:var(--ink-soft); line-height:1.5;}
  .gamestat{font-family:"IBM Plex Mono"; font-size:12.5px; color:var(--ink-faint);}
  .matchgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px 18px;}
  .matchtile{
    padding:10px 12px; border:1.5px solid var(--line); border-radius:9px; background:var(--surface-alt);
    cursor:pointer; font-size:13.5px; text-align:center; min-height:44px; display:flex; align-items:center; justify-content:center;
  }
  .matchtile.sel{border-color:var(--blue); background:var(--blue-tint);}
  .matchtile.ok{border-color:var(--success); background:var(--success-tint); cursor:default; opacity:.75;}
  .matchtile.bad{border-color:var(--danger); background:var(--danger-tint); animation:shake .3s;}
  @keyframes shake{25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
  .clockrow{display:flex; align-items:center; gap:16px; font-family:"IBM Plex Mono"; font-size:14px;}
  .clockrow .big{font-size:26px; font-weight:600;}

  /* Teacher */
  .modal-backdrop{position:fixed; inset:0; background:rgba(10,20,30,.55); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;}
  .modal{background:var(--surface); border-radius:16px; padding:28px; width:min(380px,100%); box-shadow:var(--shadow); border:1px solid var(--line);}
  .modal h2{margin:0 0 6px; font-size:19px; color:var(--blue-deep);}
  .modal p{font-size:13.5px; color:var(--ink-soft); margin:0 0 16px;}
  .pin-input{letter-spacing:.4em; text-align:center; font-family:"IBM Plex Mono"; font-size:20px;}
  table.dash{width:100%; border-collapse:collapse; font-size:13.5px;}
  table.dash th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); padding:8px 10px; border-bottom:2px solid var(--line);}
  table.dash td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top;}
  table.dash tr:hover td{background:var(--surface-alt);}
  .scorepill{font-family:"IBM Plex Mono"; font-size:12px; padding:2px 8px; border-radius:6px; background:var(--surface-alt); white-space:nowrap;}
  .studentdetail{background:var(--surface-alt); border-radius:10px; padding:14px 16px; margin-top:6px; font-size:13px;}
  .toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px;}

  footer.hint{max-width:1180px; margin:0 auto; padding:10px clamp(16px,3vw,28px) 30px; font-size:12px; color:var(--ink-faint);}

  @media (max-width:820px){
    .shell{flex-direction:column;}
    .sidebar{position:static; width:100%; flex-direction:row; overflow-x:auto; padding:12px 12px 6px; gap:8px;}
    .sidebar .grouplabel{display:none;}
    .tab{flex-direction:column; align-items:flex-start; min-width:132px; gap:4px;}
    .tab .stripe{width:100%; height:4px;}
  }
  [hidden]{display:none !important;}
</style>
</head>
<body>

<div id="app"></div>
<footer class="hint">HAK English Lab &middot; pilot build &middot; Units 1&ndash;3 + Grammar Review &middot; Business in Context 2. HAK</footer>

<!-- Firebase (compat API — matches the app's existing db.doc()/db.collection() calls) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
(function(){
"use strict";

/* ============================================================
   CONTENT DATA — Units 1–3 + Grammar Review
   ============================================================ */
function mcq(q, options, a){ return {type:"mcq", q, options, a}; }
function tf(q, accepted){ return {type:"text", q, accepted}; }
/* Pronunciation item: spoken via the browser's built-in text-to-speech (no microphone needed),
   plus a written "banana buh-NAN-uh"-style respelling of the key word. rp is only set when
   Received Pronunciation actually differs from General American (mainly non-rhotic r-dropping). */
function pr(text, focus, ga, rp){ return {text, focus, ga, rp: rp||null}; }

const UNITS = {

unit1: {
  id:"unit1", order:1, label:"Unit 1", title:"This is where we belong", pages:"p. 12–21", accent:"var(--tab-1)",
  tasks: [
    {page:"12", ex:"1", instr:"Word power: definitions. Match the words (1–7) from the text “Multicultural Europe” to the definitions (A–E). Two words do not have a definition — write your own.", hint:"Skim the text first, then find each word in context before choosing a definition."},
    {page:"13", ex:"2", instr:"Synonyms & antonyms. Complete the exercise using the text on p. 12.", hint:"Decide first whether you need a word with the same or the opposite meaning."},
    {page:"13", ex:"3", instr:"Gap-fill dialogue. Complete the dialogue using the words from exercise 2.", hint:"Finish exercise 2 first — this exercise reuses those exact words."},
    {page:"13", ex:"4", instr:"Collocations. Match the collocations that belong together.", hint:"Say each pair out loud — a correct collocation should sound natural to you."},
    {page:"17", ex:"7", instr:"Discussing youth statistics. Study one infographic on your own, then discuss your findings in a small group and prepare to report back to the class.", hint:"Use the trend phrases from the Vocabulary tab (“a significant rise”, “just under a third” …) in your notes."},
    {page:"18", ex:"1", instr:"Preparing to listen. Discuss with a partner: what problems — and what positive things — might happen when sharing a flat with other young adults?", hint:"Think about six aspects: entertainment, family, food, language, privacy, socialising."},
    {page:"18", ex:"2", instr:"Listening: note-taking (Track 2). Listen to the interview with Nagesh, Ryan, Hassan and Ji-hoon and complete their profiles (country, religion, food preferences).", hint:"On your first listen, focus only on country and religion — food comes on the second listen."},
    {page:"19", ex:"3", instr:"Listening: multiple choice (Track 2). Choose the correct answer (A, B, C or D) for questions 1–6.", hint:"Read all four options before you listen again — two options often sound similar."},
    {page:"20", ex:"4", instr:"Listening for detail (Track 2). Answer the three questions in your own words, then compare your answers with a partner.", hint:""},
    {page:"20", ex:"5", instr:"Grammar in use: reported questions. Rewrite the six direct questions as reported questions.", hint:"No question word order, no do/does/did, backshift the tense — see the Grammar tab for the rule."},
    {page:"20", ex:"6", instr:"Discussion: multicultural flatshare. Discuss what would be best about it, what might be a problem, and how you would solve it. Report your ideas to the class.", hint:""},
    {page:"21", ex:"—", instr:"“Can do” self-assessment. Fill in the table: what can you already do after Unit 1?", hint:""},
  ],
  vocab: [
    {en:"multicultural", de:"multikulturell"},
    {en:"to belong somewhere", de:"irgendwo dazugehören"},
    {en:"flatmate", de:"Mitbewohner:in"},
    {en:"to share a flat", de:"sich eine Wohnung teilen"},
    {en:"youth unemployment", de:"Jugendarbeitslosigkeit"},
    {en:"a significant rise", de:"ein deutlicher Anstieg"},
    {en:"a sharp decline", de:"ein starker Rückgang"},
    {en:"just under a third", de:"knapp ein Drittel"},
    {en:"nearly one in five", de:"fast jede:r Fünfte"},
    {en:"the majority of", de:"die Mehrheit von"},
    {en:"vegetarian", de:"Vegetarier:in"},
    {en:"religion", de:"Religion"},
    {en:"to accept differences", de:"Unterschiede akzeptieren"},
    {en:"cultural background", de:"kultureller Hintergrund"},
    {en:"privacy", de:"Privatsphäre"},
    {en:"attitude", de:"Einstellung"},
  ],
  grammarFocus: "Reported questions",
  grammar: [
    mcq("“Do you like curry?” → She asked me ___ I liked curry.", ["if","that","why","do"], 0),
    mcq("“Where do you live?” → He asked me where I ___.", ["live","lived","do live","had lived"], 1),
    mcq("“Have you finished?” → The teacher asked if we ___ finished.", ["have","had","has","having"], 1),
    mcq("“What time does the shop close?” → Ryan asked what time the shop ___.", ["closes","closed","close","is closing"], 1),
    mcq("“Are you eating properly?” → His mother asked if he ___ eating properly.", ["is","was","be","been"], 1),

function downloadFile(filename, text){
  try{
    const blob = new Blob([text], {type:"text/csv;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    return true;
  }catch(e){ return false; }
}

function slug(name){
  return String(name).trim().toLowerCase()
    .replace(/[äáàâ]/g,"a").replace(/[ëéèê]/g,"e").replace(/[ïíìî]/g,"i")
    .replace(/[öóòô]/g,"o").replace(/[üúùû]/g,"u").replace(/ß/g,"ss").replace(/ñ/g,"n")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,60) || "student";
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function qs(sel,root){ return (root||document).querySelector(sel); }
function qsa(sel,root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function wordCount(s){ return (String(s).trim().match(/\S+/g)||[]).length; }

/* ============================================================
   DB HELPERS — always read-modify-write full doc (safe merge)
   ============================================================ */
function blankStudent(name){
  const per = ()=>({ tasksDone:[], vocabScore:null, grammarScore:null, quizScore:null,
                      pronunciation:{done:[]}, writing:null,
                      games:{matchBestMs:null, clockBest:null} });
  const doc = { name, createdAt: Date.now(), lastActive: Date.now() };
  UNIT_ORDER.forEach(u=>{ doc[u]=per(); });
  return doc;
}
async function loadStudent(name){
  if(!claudeDb) return null;
  const id = slug(name);
  try{
    const snap = await claudeDb.doc("students/"+id).get();
    let data = snap && snap.exists ? snap.data() : null;
    if(!data){ data = blankStudent(name); await claudeDb.doc("students/"+id).set(data); }
    UNIT_ORDER.forEach(u=>{ if(!data[u]) data[u]=blankStudent(name)[u]; });
    studentCache[id]=data;
    return data;
  }catch(e){ console.warn("loadStudent failed", e); return blankStudent(name); }
}
async function updateStudent(name, mutator){
  if(!claudeDb) return;
  const id = slug(name);
  try{
    const snap = await claudeDb.doc("students/"+id).get();
    let data = snap && snap.exists ? snap.data() : blankStudent(name);
    UNIT_ORDER.forEach(u=>{ if(!data[u]) data[u]=blankStudent(name)[u]; });
    data.lastActive = Date.now();
    mutator(data);
    await claudeDb.doc("students/"+id).set(data);
    studentCache[id]=data;
  }catch(e){ console.warn("updateStudent failed", e); }
}

function hasAnyProgress(data){
  if(!data) return false;
  return UNIT_ORDER.some(u=>{
    const d = data[u]; if(!d) return false;
    return (d.tasksDone && d.tasksDone.length>0) || d.vocabScore || d.grammarScore || d.quizScore || d.writing ||
      (d.pronunciation && d.pronunciation.done && d.pronunciation.done.length>0) ||
      (d.games && (d.games.matchBestMs!=null || d.games.clockBest!=null));
  });
}

   accidentally sharing one name and merging their progress. */
function confirmNameModal(name){
  return new Promise(resolve=>{
    const backdrop = el(`<div class="modal-backdrop"></div>`);
    document.body.appendChild(backdrop);
    backdrop.appendChild(el(`<div class="modal">
      <h2>Is this you?</h2>
      <p>There’s already saved progress under the name “${esc(name)}”. If that’s your own work from before, continue. If it might be a classmate, please use a more specific name instead — e.g. add your last initial, like “${esc(name)} K”.</p>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button class="btn btn-primary" id="confirmYes">Yes, that’s me — continue</button>
        <button class="btn btn-ghost" id="confirmNo">Use a different name</button>
      </div>
    </div>`));
    qs("#confirmYes",backdrop).addEventListener("click", ()=>{ backdrop.remove(); resolve(true); });
    qs("#confirmNo",backdrop).addEventListener("click", ()=>{ backdrop.remove(); resolve(false); });
  });
}

/* ---------------- Generic gradable list (grammar / quiz / vocab self-check) ---------------- */
function renderGradableList(container, items, onGraded, buttonLabel, keyPrefix, opts){
  opts = opts || {};
  const revealAnswer = opts.revealAnswer !== false; // default true (Unit Check keeps showing the correct answer)
  const allowReset = !!opts.allowReset;
  container.innerHTML="";
  const list = el(`<div class="stack"></div>`);
  const answers = new Array(items.length).fill(null);
  items.forEach((it, idx)=>{
    const card = el(`<div class="qitem" data-idx="${idx}"><div class="qtext">${idx+1}. ${esc(it.q)}</div></div>`);
    if(it.type==="mcq"){
      const opts_ = el(`<div class="options"></div>`);
      it.options.forEach((opt,oi)=>{
        const row = el(`<label class="opt"><input type="radio" name="${keyPrefix}-${idx}"><span>${esc(opt)}</span></label>`);
        qs("input",row).addEventListener("change", ()=>{
          answers[idx]=oi;
          qsa(".opt",opts_).forEach(o=>o.classList.remove("selected"));
          row.classList.add("selected");
        });
        opts_.appendChild(row);
      });
      card.appendChild(opts_);
    } else {
      const inp = el(`<input type="text" placeholder="Type your answer…" style="max-width:340px">`);
      inp.addEventListener("input", ()=>{ answers[idx]=inp.value; });
      card.appendChild(inp);
    }
    card.appendChild(el(`<div class="qanswerline" hidden></div>`));
    list.appendChild(card);
  });
  container.appendChild(list);
  const bar = el(`<div style="margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"></div>`);
  const goBtn = el(`<button class="btn btn-blue">${esc(buttonLabel)}</button>`);
  bar.appendChild(goBtn);
  let resetBtn = null;
  if(allowReset){
    resetBtn = el(`<button class="btn btn-ghost">Reset &amp; try again</button>`);
    bar.appendChild(resetBtn);
  }
  const resultSlot = el(`<div style="flex:1"></div>`); bar.appendChild(resultSlot);
  container.appendChild(bar);

  goBtn.addEventListener("click", ()=>{
    let correctCount=0;
    items.forEach((it,idx)=>{
      const card = qs(`.qitem[data-idx="${idx}"]`, list);
      const ansLine = qs(".qanswerline", card);
      let isCorrect=false, correctText="";
      if(it.type==="mcq"){
        correctText = it.options[it.a];
        isCorrect = answers[idx]===it.a;
        qsa(".opt", card).forEach((o,oi)=>{
          o.classList.remove("correct","incorrect");
          if(revealAnswer){
            if(oi===it.a) o.classList.add("correct");
            else if(oi===answers[idx]) o.classList.add("incorrect");
          } else if(oi===answers[idx]){
            o.classList.add(isCorrect?"correct":"incorrect");
          }
        });
      } else {
        correctText = it.accepted[0];
        const given = String(answers[idx]||"").trim().toLowerCase();
        isCorrect = it.accepted.some(a=>a.toLowerCase()===given);
      }
      card.classList.remove("graded-correct","graded-incorrect");
      card.classList.add(isCorrect?"graded-correct":"graded-incorrect");
      ansLine.hidden=false;
      if(isCorrect) ansLine.innerHTML = `✅ Correct.`;
      else ansLine.innerHTML = revealAnswer ? `❌ Correct answer: <b>${esc(correctText)}</b>` : `❌ Not quite — try again.`;
      if(isCorrect) correctCount++;
    });
    const pct = Math.round(100*correctCount/items.length);
    const tone = pct>=80?"success":pct>=50?"warning":"info";
    resultSlot.innerHTML = `<div class="resultbar"><span class="score mono">${correctCount} / ${items.length}</span>
      <span class="badge badge-${tone}">${pct}%</span></div>`;
    onGraded && onGraded(correctCount, items.length);
  });

  if(resetBtn){
    resetBtn.addEventListener("click", ()=>{
      answers.fill(null);
      qsa(".qitem", list).forEach(card=>{
        qsa("input[type=radio]", card).forEach(r=>{ r.checked=false; });
        qsa(".opt", card).forEach(o=>o.classList.remove("selected","correct","incorrect"));
        const textInput = qs("input[type=text]", card);
        if(textInput) textInput.value="";
        card.classList.remove("graded-correct","graded-incorrect");
        const ansLine = qs(".qanswerline", card);
        ansLine.hidden = true; ansLine.innerHTML = "";
      });
      resultSlot.innerHTML = "";
    });
  }
}

/* ---------------- Pronunciation ---------------- */
const TTS = window.speechSynthesis;
let ttsVoices = [];
function loadTtsVoices(){ try{ ttsVoices = TTS ? TTS.getVoices() : []; }catch(e){} }
if(TTS){ loadTtsVoices(); TTS.onvoiceschanged = loadTtsVoices; }
function pickVoice(accent){
  // accent: "US" or "GB". Falls back to any English voice, then the browser default.
  if(!ttsVoices.length) return null;
  const byLang = ttsVoices.filter(v=>v.lang && v.lang.toLowerCase().startsWith(accent==="GB"?"en-gb":"en-us"));
  if(byLang.length) return byLang[0];
  const anyEn = ttsVoices.filter(v=>v.lang && v.lang.toLowerCase().startsWith("en"));
  return anyEn[0] || ttsVoices[0] || null;
}
function speak(text, accent){
  if(!TTS) return false;
  try{
    TTS.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice(accent||"US");
    if(v) u.voice = v;
    u.rate = 0.92;
    TTS.speak(u);
    return true;
  }catch(e){ return false; }
}

      : `<b>${esc(item.focus)}</b>: ${esc(item.ga)} <span class="mono" style="color:var(--ink-faint)">(GA &amp; RP)</span>`;
    const row = el(`<div class="prow" style="align-items:flex-start">

          ${TTS ? `<button class="mic" title="Listen (General American)" data-accent="US">▶</button>
                   <button class="mic" title="Listen (Received Pronunciation)" data-accent="GB" style="background:var(--ink-soft)">▶ RP</button>` : ""}
          <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);cursor:pointer">
            <input type="checkbox" style="width:18px;height:18px;accent-color:var(--success)" ${done?"checked":""}> I can say this
          </label>

    qsa(".mic", row).forEach(btn=>{

      });

function matchGameCard(unit){
  const card = el(`<div class="gamecard">
      <h3>🧩 Match Rally</h3>
      <div class="gdesc">Click a term, then click its match. Match all pairs as fast as you can.</div>
      <div class="gamestat" id="mBest">Best time: —</div>
      <div id="mArea"></div>
      <button class="btn btn-blue btn-sm" id="mStart">Start round</button>
    </div>`);
  const best = qs("#mBest", card), area = qs("#mArea", card);
  loadBest();
  async function loadBest(){
    if(!studentName) return;
    const d = await loadStudent(studentName);
    if(d && d[unit.id].games.matchBestMs) best.textContent = "Best time: "+(d[unit.id].games.matchBestMs/1000).toFixed(1)+"s";
  }
  qs("#mStart", card).addEventListener("click", ()=>startRound());

  function startRound(){
    const N = Math.min(6, unit.vocab.length);
    const pairs = shuffle(unit.vocab).slice(0,N);
    const left = shuffle(pairs.map((p,i)=>({key:i, text:p.en})));
    const right = shuffle(pairs.map((p,i)=>({key:i, text:p.de})));
    let selL=null, selR=null, matched=0, mistakes=0, t0=Date.now(), timerId;
    area.innerHTML = `<div class="clockrow"><span>⏱ <span class="big mono" id="mTime">0.0</span>s</span><span class="mono" id="mMiss">0 mistakes</span></div>
      <div class="matchgrid" id="mGrid" style="margin-top:10px"></div>`;
    const grid = qs("#mGrid", area);
    left.forEach(item=>grid.appendChild(tile(item,"L")));
    right.forEach(item=>grid.appendChild(tile(item,"R")));
    timerId = setInterval(()=>{ qs("#mTime",area).textContent = ((Date.now()-t0)/1000).toFixed(1); }, 100);

    function tile(item, side){
      const t = el(`<div class="matchtile" data-key="${item.key}" data-side="${side}">${esc(item.text)}</div>`);
      t.addEventListener("click", ()=>{
        if(t.classList.contains("ok")) return;
        if(side==="L"){ if(selL) selL.classList.remove("sel"); selL=t; t.classList.add("sel"); }
        else { if(selR) selR.classList.remove("sel"); selR=t; t.classList.add("sel"); }
        if(selL && selR){
          if(selL.dataset.key===selR.dataset.key){
            selL.classList.remove("sel"); selR.classList.remove("sel");
            selL.classList.add("ok"); selR.classList.add("ok");
            matched++; selL=null; selR=null;
            if(matched===N){
              clearInterval(timerId);
              const ms = Date.now()-t0;
              qs("#mMiss",area).textContent = mistakes+" mistakes";
              area.appendChild(el(`<div class="resultbar" style="margin-top:12px"><span class="score mono">${(ms/1000).toFixed(1)}s</span><span class="badge badge-success">All matched · ${mistakes} mistakes</span></div>`));
              (async ()=>{ if(studentName) await updateStudent(studentName, data=>{
                const g=data[unit.id].games; if(!g.matchBestMs || ms<g.matchBestMs) g.matchBestMs=ms;
              }); loadBest(); })();
            }
          } else {
            mistakes++; qs("#mMiss",area).textContent = mistakes+" mistakes";
            selL.classList.add("bad"); selR.classList.add("bad");
            setTimeout(()=>{ selL&&selL.classList.remove("sel","bad"); selR&&selR.classList.remove("sel","bad"); selL=null; selR=null; }, 350);
          }
        }
      });
      return t;
    }
  }
  return card;
}

function clockGameCard(unit){
  const card = el(`<div class="gamecard">
      <h3>⏱ Beat the Clock</h3>
      <div class="gdesc">45 seconds. Answer as many grammar &amp; vocab questions as you can.</div>
      <div class="gamestat" id="cBest">Best score: —</div>
      <div id="cArea"></div>
      <button class="btn btn-blue btn-sm" id="cStart">Start round</button>
    </div>`);
  const best = qs("#cBest", card), area = qs("#cArea", card);
  loadBest();
  async function loadBest(){
    if(!studentName) return;
    const d = await loadStudent(studentName);
    if(d && d[unit.id].games.clockBest!=null) best.textContent = "Best score: "+d[unit.id].games.clockBest;
  }
  qs("#cStart", card).addEventListener("click", ()=>startRound());

  function startRound(){
    const pool = shuffle(unit.grammar.filter(x=>x.type==="mcq").concat(unit.quiz.filter(x=>x.type==="mcq")));
    let idx=0, score=0, timeLeft=45, timerId;
    area.innerHTML = `<div class="clockrow"><span class="big mono" id="cClock">45</span>s
        <span class="mono">score: <b id="cScore">0</b></span></div><div id="cQ" style="margin-top:10px"></div>`;
    const clockEl = qs("#cClock",area), scoreEl = qs("#cScore",area), qEl = qs("#cQ",area);
    timerId = setInterval(()=>{
      timeLeft--; clockEl.textContent = timeLeft;
      if(timeLeft<=0) finish();
    },1000);
    nextQ();
    function nextQ(){
      if(idx>=pool.length) idx=0;
      const it = pool[idx++];
      qEl.innerHTML = "";
      const box = el(`<div class="qitem"><div class="qtext">${esc(it.q)}</div><div class="options"></div></div>`);
      const opts = qs(".options",box);
      it.options.forEach((o,oi)=>{
        const b = el(`<button class="opt" style="cursor:pointer;width:100%;text-align:left;background:none;font-family:inherit;font-size:14px;color:var(--ink)">${esc(o)}</button>`);
        b.addEventListener("click", ()=>{
          qsa(".opt",opts).forEach(x=>x.style.pointerEvents="none");
          if(oi===it.a){ b.classList.add("correct"); score+=10; scoreEl.textContent=score; }
          else { b.classList.add("incorrect"); qsa(".opt",opts)[it.a].classList.add("correct"); }
          setTimeout(()=>{ if(timeLeft>0) nextQ(); }, 500);
        });
        opts.appendChild(b);
      });
      qEl.appendChild(box);
    }
    function finish(){
      clearInterval(timerId);
      qEl.innerHTML = "";
      area.querySelector(".clockrow").innerHTML = `Time’s up!`;
      area.appendChild(el(`<div class="resultbar" style="margin-top:8px"><span class="score mono">${score} pts</span><span class="badge badge-success">Round complete</span></div>`));
      (async ()=>{ if(studentName) await updateStudent(studentName, data=>{
        const g=data[unit.id].games; if(g.clockBest==null || score>g.clockBest) g.clockBest=score;
      }); loadBest(); })();
    }
  }
  return card;
}

function openTeacherLogin(){
  const backdrop = el(`<div class="modal-backdrop"></div>`);
  document.body.appendChild(backdrop);
  renderLoginModal();

  async function renderLoginModal(){
    backdrop.innerHTML="";
    if(!claudeDb){
      backdrop.appendChild(el(`<div class="modal"><h2>Teacher area unavailable</h2><p>Progress tracking isn’t available in this view, so there’s nothing to log into.</p><button class="btn btn-ghost" id="close">Close</button></div>`));
      qs("#close",backdrop).addEventListener("click", ()=>backdrop.remove());
      return;
    }
    let hasPin=false, existing=null;
    try{ const snap=await claudeDb.doc("config/teacher").get(); if(snap&&snap.exists){ existing=snap.data(); hasPin=!!(existing&&existing.pin); } }catch(e){}
    if(!hasPin){
      backdrop.appendChild(el(`<div class="modal">
        <h2>Set up your teacher PIN</h2>
        <p>No PIN exists yet for this class. Choose a 4–6 digit PIN — you’ll use it to open the progress dashboard.</p>
        <div class="field"><input class="pin-input" id="pin1" type="password" inputmode="numeric" maxlength="6" placeholder="••••"></div>
        <div class="field"><input class="pin-input" id="pin2" type="password" inputmode="numeric" maxlength="6" placeholder="confirm"></div>
        <p id="pinErr" style="color:var(--danger);display:none;font-size:12.5px"></p>
        <div style="display:flex;gap:8px"><button class="btn btn-primary" id="setPin" style="flex:1">Save PIN</button><button class="btn btn-ghost" id="cancelPin">Cancel</button></div>
      </div>`));
      qs("#cancelPin",backdrop).addEventListener("click",()=>backdrop.remove());
      qs("#setPin",backdrop).addEventListener("click", async ()=>{
        const a=qs("#pin1",backdrop).value.trim(), b=qs("#pin2",backdrop).value.trim();
        const err=qs("#pinErr",backdrop);
        if(a.length<4||!/^\d+$/.test(a)){ err.textContent="PIN must be at least 4 digits."; err.style.display="block"; return; }
        if(a!==b){ err.textContent="PINs don’t match."; err.style.display="block"; return; }
        try{ await claudeDb.doc("config/teacher").set({pin:a}); backdrop.remove(); enterTeacher(); }
        catch(e){ err.textContent="Couldn’t save the PIN — please try again."; err.style.display="block"; }
      });
      return;
    }
    backdrop.appendChild(el(`<div class="modal">
      <h2>Teacher login</h2>
      <p>Enter your PIN to view student progress.</p>
      <div class="field"><input class="pin-input" id="pinTry" type="password" inputmode="numeric" maxlength="6" placeholder="••••"></div>
      <p id="pinErr2" style="color:var(--danger);display:none;font-size:12.5px">Incorrect PIN.</p>
      <div style="display:flex;gap:8px"><button class="btn btn-primary" id="doLogin" style="flex:1">Log in</button><button class="btn btn-ghost" id="cancelLogin">Cancel</button></div>
    </div>`));
    qs("#cancelLogin",backdrop).addEventListener("click",()=>backdrop.remove());
    const tryLogin = ()=>{
      const v=qs("#pinTry",backdrop).value.trim();
      if(v===existing.pin){ backdrop.remove(); enterTeacher(); }
      else { qs("#pinErr2",backdrop).style.display="block"; }
    };
    qs("#doLogin",backdrop).addEventListener("click", tryLogin);
    qs("#pinTry",backdrop).addEventListener("keydown", e=>{ if(e.key==="Enter") tryLogin(); });
    setTimeout(()=>qs("#pinTry",backdrop).focus(),30);
  }
}

function enterTeacher(){ isTeacher = true; render(); }

async function renderTeacher(){
  app.innerHTML = "";
  const bar = el(`<div class="topbar">
    <div class="brandmark">EN</div>
    <div class="brandtext"><b>HAK English Lab</b><span>Teacher dashboard</span></div>
    <div class="topbar-spacer"></div>
    <button class="btn btn-ghost btn-sm" id="exportCsv">Export CSV</button>
    <button class="btn btn-ghost btn-sm" id="changePin">Change PIN</button>
    <button class="iconbtn" id="exitTeacher" title="Exit">×</button>
  </div>`);
  app.appendChild(bar);
  qs("#exitTeacher",bar).addEventListener("click", ()=>{ isTeacher=false; render(); });
  qs("#changePin",bar).addEventListener("click", openChangePin);
  const main = el(`<main class="content" style="max-width:1180px;margin:0 auto"></main>`);
  app.appendChild(main);
  main.appendChild(el(`<div class="modheader"><h2>Student progress</h2></div>`));
  main.appendChild(el(`<p class="subline">Live view of every student who has used the app. Click a row to see writing feedback and detailed scores. There are no passwords, so each row is one login name — if two students ever share a name, their progress merges into one row; the app warns students when they type a name that already has saved progress, but it’s worth telling any duplicates (e.g. two Lenas) to add a last initial.</p>`));
  const tableSlot = el(`<div id="tableSlot"><p style="color:var(--ink-faint)">Loading…</p></div>`);
  main.appendChild(tableSlot);

  if(!claudeDb){ tableSlot.innerHTML = `<div class="card">Progress tracking isn’t available in this view.</div>`; return; }

  let students = [];
  try{
    const snap = await claudeDb.collection("students").get();
    students = (snap && snap.docs ? snap.docs.map(d=>d.data()) : []).sort((a,b)=>(b.lastActive||0)-(a.lastActive||0));
  }catch(e){}

  qs("#exportCsv",bar).addEventListener("click", ()=>exportCsv(students));

  if(!students.length){ tableSlot.innerHTML = `<div class="card">No students yet — once someone enters their name and starts practising, they’ll show up here.</div>`; return; }

  function fmtScore(s){ return s ? `<span class="scorepill">${s.correct}/${s.total}</span>` : "<span style='color:var(--ink-faint)'>—</span>"; }
  function fmtDate(ts){ if(!ts) return "—"; const d=new Date(ts); return d.toLocaleDateString()+" "+d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}); }

  const table = el(`<table class="dash"><thead><tr>
      <th>Student</th><th>Last active</th>
      <th>U1 check</th><th>U2 check</th><th>U3 check</th><th>Gram. review</th>
      <th>Tasks done</th><th>Writing</th><th>Pronunciation</th>
    </tr></thead><tbody></tbody></table>`);
  const tbody = qs("tbody", table);
  students.forEach(s=>{
    const tasksDone = UNIT_ORDER.reduce((sum,u)=> sum + ((s[u]&&s[u].tasksDone)?s[u].tasksDone.length:0), 0);
    const writingCount = UNIT_ORDER.reduce((sum,u)=> sum + ((s[u]&&s[u].writing)?1:0), 0);
    const writingNeedsFeedback = UNIT_ORDER.reduce((sum,u)=> sum + ((s[u]&&s[u].writing && !s[u].writing.feedback)?1:0), 0);
    const pronDone = UNIT_ORDER.reduce((sum,u)=> sum + ((s[u]&&s[u].pronunciation&&s[u].pronunciation.done)?s[u].pronunciation.done.length:0), 0);
    const tr = el(`<tr style="cursor:pointer">
        <td><b>${esc(s.name)}</b></td>
        <td class="mono">${fmtDate(s.lastActive)}</td>
        <td>${fmtScore(s.unit1&&s.unit1.quizScore)}</td>
        <td>${fmtScore(s.unit2&&s.unit2.quizScore)}</td>
        <td>${fmtScore(s.unit3&&s.unit3.quizScore)}</td>
        <td>${fmtScore(s.grammarreview&&s.grammarreview.quizScore)}</td>
        <td class="mono">${tasksDone}</td>
        <td class="mono">${writingCount}${writingNeedsFeedback>0?` <span class="badge badge-warning" style="margin-left:4px">${writingNeedsFeedback} awaiting feedback</span>`:""}</td>
        <td class="mono">${pronDone}</td>
      </tr>`);
    const detail = el(`<tr class="detailrow" hidden><td colspan="9"></td></tr>`);
    tr.addEventListener("click", ()=>{
      detail.hidden = !detail.hidden;
      if(!detail.hidden) renderStudentDetail(qs("td",detail), s);
    });
    tbody.appendChild(tr); tbody.appendChild(detail);
  });
  tableSlot.innerHTML=""; tableSlot.appendChild(table);
}

async function saveTeacherFeedback(studentName, unitId, feedbackText){
  if(!claudeDb) return;
  const id = slug(studentName);
  try{
    const snap = await claudeDb.doc("students/"+id).get();
    if(!snap || !snap.exists) return;
    const data = snap.data();
    if(!data[unitId] || !data[unitId].writing) return;
    data[unitId].writing.feedback = feedbackText;
    data[unitId].writing.feedbackAt = Date.now();
    await claudeDb.doc("students/"+id).set(data);
    studentCache[id] = data;
  }catch(e){ console.warn("saveTeacherFeedback failed", e); }
}

function renderStudentDetail(container, s){
  container.innerHTML = "";
  const wrap = el(`<div class="studentdetail"><div class="grid2"></div></div>`);
  const grid = qs(".grid2", wrap);
  UNIT_ORDER.forEach(u=>{
    const d = s[u]||{};
    const pronDone = (d.pronunciation && d.pronunciation.done) ? d.pronunciation.done.length : 0;
    const box = el(`<div>
      <b>${esc(UNITS[u].label)}</b><br>
      Vocab: ${d.vocabScore?d.vocabScore.correct+"/"+d.vocabScore.total:"—"} ·
      Grammar: ${d.grammarScore?d.grammarScore.correct+"/"+d.grammarScore.total:"—"} ·
      Check: ${d.quizScore?d.quizScore.correct+"/"+d.quizScore.total:"—"}<br>
      Games — Match: ${d.games&&d.games.matchBestMs?(d.games.matchBestMs/1000).toFixed(1)+"s":"—"},
      Clock: ${d.games&&d.games.clockBest!=null?d.games.clockBest:"—"}<br>
      Pronunciation marked confident: ${pronDone}/${UNITS[u].pronunciation.length}
    </div>`);
    if(d.writing){
      const fb = el(`<div class="feedbackbox" style="margin-top:8px">
        <span class="ftitle">Writing — ${d.writing.wordCount} words, ${new Date(d.writing.at).toLocaleDateString()}</span>
        <div style="white-space:pre-wrap;margin-bottom:10px">${esc(d.writing.text)}</div>
        <label style="display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--orange);margin-bottom:6px;font-weight:600">Your feedback</label>
        <textarea class="fbInput" style="min-height:70px;font-size:13.5px" placeholder="Write feedback for ${esc(s.name)}…">${esc(d.writing.feedback||"")}</textarea>
        <div style="display:flex;align-items:center;gap:10px;margin-top:8px">
          <button class="btn btn-primary btn-sm fbSave">Save feedback</button>
          <span class="fbStatus" style="font-size:12px;color:var(--ink-soft)">${d.writing.feedback?"Feedback given "+(d.writing.feedbackAt?new Date(d.writing.feedbackAt).toLocaleDateString():""):"Not yet given"}</span>
        </div>
      </div>`);
      qs(".fbSave", fb).addEventListener("click", async ()=>{
        const text = qs(".fbInput", fb).value.trim();
        const status = qs(".fbStatus", fb);
        status.textContent = "Saving…";
        await saveTeacherFeedback(s.name, u, text);
        status.textContent = "Saved just now.";
      });
      box.appendChild(fb);
    }
    grid.appendChild(box);
  });
  container.appendChild(wrap);
}

function exportCsv(students){
  const rows = [["Name","Last active","Unit1 check","Unit2 check","Unit3 check","Grammar review check","Tasks done","Writing submissions","Writing awaiting feedback","Pronunciation phrases marked confident"]];
  students.forEach(s=>{
    const tasksDone = UNIT_ORDER.reduce((sum,u)=> sum + ((s[u]&&s[u].tasksDone)?s[u].tasksDone.length:0), 0);
    const writingCount = UNIT_ORDER.reduce((sum,u)=> sum + ((s[u]&&s[u].writing)?1:0), 0);
    const writingNeedsFeedback = UNIT_ORDER.reduce((sum,u)=> sum + ((s[u]&&s[u].writing && !s[u].writing.feedback)?1:0), 0);
    const pronDone = UNIT_ORDER.reduce((sum,u)=> sum + ((s[u]&&s[u].pronunciation&&s[u].pronunciation.done)?s[u].pronunciation.done.length:0), 0);
    const sc = u => s[u]&&s[u].quizScore ? s[u].quizScore.correct+"/"+s[u].quizScore.total : "";
    rows.push([s.name, s.lastActive?new Date(s.lastActive).toISOString():"", sc("unit1"), sc("unit2"), sc("unit3"), sc("grammarreview"), tasksDone, writingCount, writingNeedsFeedback, pronDone]);
  });
  const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const ok = downloadFile("hak-english-lab-progress.csv", csv);
  if(!ok) alert("Download didn’t start — please copy the table manually.");
}

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  try{
    if(typeof firebase === "undefined") throw new Error("Firebase SDK failed to load");
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    claudeDb = firebase.firestore();
  }catch(e){
    console.error("Firebase init failed:", e);
    claudeDb = null;
  }
  render();
  if(studentName) loadStudent(studentName).then(()=>{ if(!isTeacher) render(); });
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot); else boot();

})();
